[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-reconciliation"
version = "0.1.0"
description = "Three cooperating agents -- extractor, validator, reconciler -- that reconcile two independently captured synthetic inventory datasets, demonstrated on a community tool-lending library."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
