[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-server"
version = "0.1.0"
description = "A small Model Context Protocol (MCP) server exposing recipe-box tools over a synthetic, invented recipe dataset."
requires-python = ">=3.12"
dependencies = [
    "mcp==1.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
