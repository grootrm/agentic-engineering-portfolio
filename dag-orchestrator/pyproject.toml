[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dag-orchestrator"
version = "0.1.0"
description = "A small dependency-aware task orchestrator: topological execution, retry-with-backoff, and cycle detection, demonstrated on a synthetic bike-share analytics pipeline."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
