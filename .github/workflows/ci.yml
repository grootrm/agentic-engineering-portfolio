name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - agent-eval-harness
          - dag-orchestrator
          - mcp-tool-server
          - multi-agent-reconciliation
          - self-improving-agent
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pip install -e .

      - run: pytest

  test-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coding-agent-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: coding-agent-pipeline/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
